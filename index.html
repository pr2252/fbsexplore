<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FBS Conference & School Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #0f172a;
    }

    #dashboard-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map { width: 100%; height: 100%; }

    /* Left Sidebar Explorer */
    #sidebar {
      width: 360px;
      background: #ffffff;
      height: 100%;
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-sizing: border-box;
    }

    @media (max-width: 900px) {
      #dashboard-wrapper { flex-direction: column; }
      #sidebar { width: 100%; height: 45vh; order: 2; }
      #map-container { height: 55vh; order: 1; }
    }

    .sidebar-header {
      background: #0f172a;
      color: #fff;
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar-actions {
      padding: 10px 16px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      flex: 1;
      transition: all 0.15s ease;
    }
    .btn-action:hover { background: #f1f5f9; color: #0f172a; }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Conference Accordion Card */
    .conf-group {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .conf-summary {
      padding: 10px 14px;
      font-weight: 700;
      font-size: 13px;
      color: #0f172a;
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .conf-summary:hover { background: #f1f5f9; }

    .conf-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }

    .school-list {
      padding: 6px 14px 10px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid #f1f5f9;
      background: #ffffff;
    }

    .school-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      user-select: none;
    }
    .school-item input[type="checkbox"] {
      cursor: pointer;
      accent-color: #0284c7;
      width: 14px;
      height: 14px;
    }
    .school-name:hover { color: #0284c7; text-decoration: underline; }

    /* Top Title Header on Map */
    #top-header {
      position: absolute;
      top: 12px;
      right: 20px;
      background: rgba(15, 23, 42, 0.92);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
      z-index: 1000;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    /* Pop-up & Tooltip Styling */
    .popup-title { font-weight: 800; font-size: 14px; margin-bottom: 2px; color: #0f172a; }
    .popup-subtitle { font-size: 11px; color: #64748b; margin-bottom: 6px; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; }
    .team-item { font-size: 12px; margin: 4px 0; line-height: 1.4; color: #334155; }
    .conf-badge { font-weight: 700; font-size: 10px; color: #fff; padding: 2px 6px; border-radius: 4px; margin-right: 6px; display: inline-block; }
    .meta-detail { font-size: 11px; color: #475569; margin-top: 4px; line-height: 1.35; }
    .wiki-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #0284c7; text-decoration: none; font-weight: 600; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #e2e8f0; width: 100%; }
    .wiki-link:hover { color: #0369a1; text-decoration: underline; }
    .venue-tooltip { background: rgba(255, 255, 255, 0.95); border: 1px solid #cbd5e1; border-radius: 4px; color: #0f172a; font-size: 11px; font-weight: 600; padding: 3px 7px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <div id="dashboard-wrapper">
    <!-- Left Sidebar with Conferences & Schools -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span>FBS Conference & School Explorer</span>
        <span id="active-count" style="font-size: 11px; font-weight: 600; opacity: 0.8;">Loading...</span>
      </div>
      <div class="sidebar-actions">
        <button class="btn-action" id="btn-all">Select All</button>
        <button class="btn-action" id="btn-none">Deselect All</button>
        <button class="btn-action" id="btn-reset">Reset View</button>
      </div>
      <div class="sidebar-content" id="sidebar-tree">
        <!-- Populated dynamically via JS -->
      </div>
    </div>

    <!-- Right Map Pane -->
    <div id="map-container">
      <div id="top-header">FBS Venues Explorer</div>
      <div id="map"></div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = "1XHaT57dHhRLtMojDEXhMn8AMScxz5F7WBe1i8y6NIe4";
    const SHEET_NAME = "NCAA FBS";

    const CONFERENCE_COLORS = {
      "ACC": "#005596", "Big Ten": "#00274c", "Big 12": "#c41230",
      "SEC": "#e0a100", "AAC": "#002b49", "CUSA": "#d1261d",
      "MAC": "#00529b", "Mountain West": "#582c83", "Pac-12": "#004b87",
      "Sun Belt": "#e06d00", "Independent": "#64748b"
    };

    const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, noWrap: true });
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, noWrap: true });

    const map = L.map('map', { zoomControl: true, minZoom: 3, layers: [osmStandard] }).setView([39.8283, -98.5795], 4);
    let activeBasemapLayer = osmStandard;
    const venueLayer = L.layerGroup().addTo(map);

    let venues = [];
    let markersMap = {}; // collegeName -> marker object

    function updateBasemapForZoom() {
      const currentZoom = map.getZoom();
      let targetLayer = currentZoom <= 6 ? osmStandard : esriSatellite;
      if (activeBasemapLayer !== targetLayer) {
        if (map.hasLayer(activeBasemapLayer)) map.removeLayer(activeBasemapLayer);
        map.addLayer(targetLayer);
        activeBasemapLayer = targetLayer;
      }
    }

    function renderSidebarTree(groupedData) {
      const container = document.getElementById('sidebar-tree');
      container.innerHTML = '';

      Object.keys(groupedData).sort().forEach(conf => {
        const schools = groupedData[conf].sort((a, b) => a.college.localeCompare(b.college));
        const color = CONFERENCE_COLORS[conf] || "#475569";

        const groupDiv = document.createElement('div');
        groupDiv.className = 'conf-group';

        const summaryDiv = document.createElement('div');
        summaryDiv.className = 'conf-summary';
        summaryDiv.innerHTML = `
          <div><span class="conf-swatch" style="background:${color};"></span>${conf} (${schools.length})</div>
          <span style="font-size:11px; color:#64748b;">▼</span>
        `;

        const listDiv = document.createElement('div');
        listDiv.className = 'school-list';
        listDiv.style.display = 'none'; // Collapsed by default

        summaryDiv.addEventListener('click', () => {
          listDiv.style.display = listDiv.style.display === 'none' ? 'flex' : 'none';
        });

        schools.forEach(v => {
          const itemLabel = document.createElement('label');
          itemLabel.className = 'school-item';
          itemLabel.innerHTML = `
            <input type="checkbox" class="school-checkbox" value="${v.college}" checked>
            <span class="school-name">${v.college}</span>
          `;

          // Clicking school name pans map to stadium
          itemLabel.querySelector('.school-name').addEventListener('click', (e) => {
            e.preventDefault();
            map.flyTo(v.coords, 15, { duration: 0.8 });
            if (markersMap[v.college]) {
              markersMap[v.college].openPopup();
            }
          });

          // Toggling checkbox updates map
          itemLabel.querySelector('.school-checkbox').addEventListener('change', updateMapFilters);
          listDiv.appendChild(itemLabel);
        });

        groupDiv.appendChild(summaryDiv);
        groupDiv.appendChild(listDiv);
        container.appendChild(groupDiv);
      });
      updateActiveCount();
    }

    function updateMapFilters() {
      venueLayer.clearLayers();
      markersMap = {};
      let visibleCount = 0;

      document.querySelectorAll('.school-checkbox').forEach(cb => {
        const collegeName = cb.value;
        const v = venues.find(item => item.college === collegeName);
        if (v && cb.checked) {
          visibleCount++;
          const color = CONFERENCE_COLORS[v.conference] || "#475569";
          const marker = L.circleMarker(v.coords, {
            radius: 6.5, fillColor: color, color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: 0.95
          }).addTo(venueLayer);

          const capacityStr = v.capacity ? Number(v.capacity).toLocaleString() : 'N/A';
          const wikiUrl = v.wikiUrl && v.wikiUrl.startsWith('http') ? v.wikiUrl : `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(v.venue + ' ' + v.college)}`;

          const popupMarkup = `
            <div class="popup-title">${v.college} ${v.mascot}</div>
            <div class="popup-subtitle"><span class="conf-badge" style="background:${color};">${v.conference}</span>${v.venueCity}</div>
            <div class="team-item"><b>Venue:</b> ${v.venue}</div>
            <div class="meta-detail"><b>Capacity:</b> ${capacityStr}</div>
            ${v.notes ? `<div class="meta-detail"><b>Notes:</b> ${v.notes}</div>` : ''}
            <a href="${wikiUrl}" target="_blank" rel="noopener noreferrer" class="wiki-link">Wikipedia: ${v.venue} &rarr;</a>
          `;

          marker.bindPopup(L.popup({ autoPan: false }).setContent(popupMarkup));
          marker.bindTooltip(`<b>${v.college}</b>`, { direction: 'top', className: 'venue-tooltip', offset: [0, -8] });
          markersMap[v.college] = marker;
        }
      });

      document.getElementById('active-count').textContent = `${visibleCount} of ${venues.length} shown`;
      updateBasemapForZoom();
    }

    function updateActiveCount() {
      const checked = document.querySelectorAll('.school-checkbox:checked').length;
      document.getElementById('active-count').textContent = `${checked} of ${venues.length} shown`;
    }

    window.handleGvizResponse = function(response) {
      if (!response || !response.table) return;
      const cols = response.table.cols.map((c, idx) => (c && c.label) ? c.label.trim() : String.fromCharCode(65 + idx));
      const rawRows = response.table.rows.map(r => {
        let rowObj = {};
        if (r && r.c) {
          r.c.forEach((cell, idx) => {
            rowObj[cols[idx] || String.fromCharCode(65 + idx)] = (cell && cell.v !== null) ? cell.v : '';
          });
        }
        return rowObj;
      });

      function getRowVal(row, possibleKeys) {
        for (let key of possibleKeys) {
          for (let rk in row) {
            if (rk.trim().toLowerCase() === key.toLowerCase()) return row[rk];
          }
        }
        return '';
      }

      venues = [];
      const grouped = {};

      rawRows.forEach(row => {
        const conf = String(getRowVal(row, ['FBS Conference', 'Conference']) || '').trim();
        const college = String(getRowVal(row, ['College/University Name', 'College', 'Team Name']) || '').trim();
        const mascot = String(getRowVal(row, ['Mascot']) || '').trim();
        const venueName = String(getRowVal(row, ['Venue Name', 'Venue']) || '').trim();
        const venueCity = String(getRowVal(row, ['Venue City', 'City']) || '').trim();
        const capacity = getRowVal(row, ['Venue Capacity for Football', 'Capacity']);
        const notes = String(getRowVal(row, ['Notes (as needed)', 'Notes']) || '').trim();
        const lat = parseFloat(getRowVal(row, ['Latitude', 'Lat']));
        const lng = parseFloat(getRowVal(row, ['Longitude', 'Lng']));
        const wikiUrl = String(getRowVal(row, ['Venue Wiki', 'Wiki', 'Wikipedia']) || '').trim();

        if (!venueName || isNaN(lat) || isNaN(lng) || !college) return;
        const vObj = { conference: conf, college, mascot, venue: venueName, venueCity, capacity, notes, coords: [lat, lng], wikiUrl };
        venues.push(vObj);

        if (!grouped[conf]) grouped[conf] = [];
        grouped[conf].push(vObj);
      });

      renderSidebarTree(grouped);
      updateMapFilters();
    };

    // Button event listeners
    document.getElementById('btn-all').addEventListener('click', () => {
      document.querySelectorAll('.school-checkbox').forEach(cb => cb.checked = true);
      updateMapFilters();
    });
    document.getElementById('btn-none').addEventListener('click', () => {
      document.querySelectorAll('.school-checkbox').forEach(cb => cb.checked = false);
      updateMapFilters();
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      map.setView([39.8283, -98.5795], 4);
    });

    const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tqx=responseHandler:handleGvizResponse`;
    const script = document.createElement('script');
    script.src = gvizUrl;
    document.body.appendChild(script);

    map.on('zoomend', updateBasemapForZoom);
  </script>
</body>
</html>
