<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FBS Conference & School Explorer Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { 
      margin: 0; padding: 0; width: 100%; height: 100%; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      background: #0f172a;
    }

    #dashboard-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }

    /* Left Sidebar Tree */
    #sidebar {
      width: 340px;
      background: #ffffff;
      height: 100%;
      box-shadow: 4px 0 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* Center Map Container */
    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    #map { width: 100%; height: 100%; }

    /* Right Info & Photo Explorer Panel */
    #explorer-panel {
      width: 380px;
      background: #ffffff;
      height: 100%;
      box-shadow: -4px 0 20px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      box-sizing: border-box;
      overflow-y: auto;
      flex-shrink: 0;
    }

    @media (max-width: 1100px) {
      #dashboard-wrapper { flex-direction: column; }
      #sidebar { width: 100%; height: 35vh; order: 2; }
      #map-container { height: 40vh; order: 1; }
      #explorer-panel { width: 100%; height: 25vh; order: 3; }
    }

    .sidebar-header {
      background: #0f172a;
      color: #fff;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .sidebar-actions {
      padding: 8px 12px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-action {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      color: #334155;
      flex: 1;
      transition: all 0.15s ease;
    }
    .btn-action:hover { background: #f1f5f9; color: #0f172a; }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Conference Accordion Card */
    .conf-group {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }

    .conf-summary {
      padding: 8px 12px;
      font-weight: 700;
      font-size: 12px;
      color: #0f172a;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .conf-summary:hover { background: #f1f5f9; }

    .conf-info-left {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      flex: 1;
    }

    .conf-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .conf-toggle-arrow {
      cursor: pointer;
      padding: 4px;
      color: #64748b;
      font-size: 10px;
    }

    .school-list {
      padding: 4px 12px 8px 22px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-top: 1px solid #f1f5f9;
      background: #ffffff;
    }

    .school-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      user-select: none;
    }
    .school-item input[type="checkbox"] {
      cursor: pointer;
      accent-color: #0284c7;
      width: 13px;
      height: 13px;
    }
    .school-name:hover { color: #0284c7; text-decoration: underline; }
    .school-item.selected-active .school-name { color: #0284c7; font-weight: 800; }

    /* Right Explorer Panel Styles */
    .panel-header {
      background: #1e293b;
      color: #fff;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .panel-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .venue-photo-container {
      width: 100%;
      height: 180px;
      background: #f1f5f9;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .venue-photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-placeholder {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 16px;
    }

    .team-title { font-size: 18px; font-weight: 800; color: #0f172a; margin: 0; }
    .team-subtitle { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 700; margin-top: 2px; }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .info-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8px 10px;
    }

    .info-label { font-size: 9px; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .info-value { font-size: 13px; font-weight: 700; color: #0f172a; margin-top: 2px; }

    .notes-box {
      background: #fef3c7;
      border: 1px solid #fde68a;
      border-radius: 6px;
      padding: 10px;
      font-size: 11px;
      color: #92400e;
      line-height: 1.4;
    }

    .wiki-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      transition: background 0.15s ease;
      margin-top: auto;
    }
    .wiki-btn:hover { background: #0369a1; }

    .venue-tooltip { background: rgba(255, 255, 255, 0.95); border: 1px solid #cbd5e1; border-radius: 4px; color: #0f172a; font-size: 11px; font-weight: 600; padding: 3px 7px; }
  </style>
</head>
<body>

  <div id="dashboard-wrapper">
    <!-- Left Sidebar: Conferences & Schools -->
    <div id="sidebar">
      <div class="sidebar-header">
        <span>Conferences & Schools</span>
        <span id="active-count" style="font-size: 11px; font-weight: 600; opacity: 0.8;">Loading...</span>
      </div>
      <div class="sidebar-actions">
        <button class="btn-action" id="btn-all">Select All</button>
        <button class="btn-action" id="btn-none">Deselect All</button>
        <button class="btn-action" id="btn-reset">Reset View</button>
      </div>
      <div class="sidebar-content" id="sidebar-tree"></div>
    </div>

    <!-- Center Map -->
    <div id="map-container">
      <div id="map"></div>
    </div>

    <!-- Right Explorer Detail Panel -->
    <div id="explorer-panel">
      <div class="panel-header">
        <span>Venue & Team Explorer</span>
        <span id="panel-conf-tag" style="font-size: 10px; font-weight: 700; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px;">FBS</span>
      </div>
      <div class="panel-body" id="panel-content">
        <div class="venue-photo-container">
          <div class="photo-placeholder">Click any stadium marker on the map or school name in the sidebar to inspect details and Wikipedia photos.</div>
        </div>
        <div>
          <h2 class="team-title">Select a School</h2>
          <div class="team-subtitle">Interactive Dashboard</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = "1XHaT57dHhRLtMojDEXhMn8AMScxz5F7WBe1i8y6NIe4";
    const SHEET_NAME = "NCAA FBS";

    const CONFERENCE_COLORS = {
      "ACC": "#005596", "Big Ten": "#00274c", "Big 12": "#c41230",
      "SEC": "#e0a100", "AAC": "#002b49", "CUSA": "#d1261d",
      "MAC": "#00529b", "Mountain West": "#582c83", "Pac-12": "#004b87",
      "Sun Belt": "#e06d00", "Independent": "#64748b"
    };

    const osmStandard = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, noWrap: true });
    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, noWrap: true });

    const map = L.map('map', { zoomControl: true, minZoom: 3, layers: [osmStandard] }).setView([39.8283, -98.5795], 4);
    let activeBasemapLayer = osmStandard;
    const venueLayer = L.layerGroup().addTo(map);

    let venues = [];
    let markersMap = {}; 
    let activeSelectedCollege = null;

    function updateBasemapForZoom() {
      const currentZoom = map.getZoom();
      let targetLayer = currentZoom <= 6 ? osmStandard : esriSatellite;
      if (activeBasemapLayer !== targetLayer) {
        if (map.hasLayer(activeBasemapLayer)) map.removeLayer(activeBasemapLayer);
        map.addLayer(targetLayer);
        activeBasemapLayer = targetLayer;
      }
    }

    async function fetchWikiImage(wikiUrl, venueName) {
      let pageTitle = "";
      if (wikiUrl && wikiUrl.includes('/wiki/')) {
        pageTitle = wikiUrl.split('/wiki/')[1];
      } else {
        pageTitle = encodeURIComponent(venueName);
      }
      const apiUrl = `https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&format=json&pithumbsize=500&titles=${pageTitle}&origin=*`;
      try {
        const response = await fetch(apiUrl);
        const data = await response.json();
        const pages = data.query.pages;
        for (let id in pages) {
          if (pages[id].thumbnail && pages[id].thumbnail.source) {
            return pages[id].thumbnail.source;
          }
        }
      } catch (e) {
        console.log("Could not fetch wiki image");
      }
      return null;
    }

    async function showVenueDetails(v) {
      activeSelectedCollege = v.college;
      const color = CONFERENCE_COLORS[v.conference] || "#475569";
      const capacityStr = v.capacity ? Number(v.capacity).toLocaleString() : 'N/A';
      const wikiUrl = v.wikiUrl && v.wikiUrl.startsWith('http') ? v.wikiUrl : `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(v.venue + ' ' + v.college)}`;

      document.getElementById('panel-conf-tag').textContent = v.conference;
      document.getElementById('panel-conf-tag').style.background = color;
      
      const panelContent = document.getElementById('panel-content');
      panelContent.innerHTML = `
        <div class="venue-photo-container" id="photo-box">
          <div class="photo-placeholder">Loading Wikipedia photo...</div>
        </div>
        <div>
          <h2 class="team-title">${v.college} ${v.mascot}</h2>
          <div class="team-subtitle">${v.venueCity}</div>
        </div>
        <div class="info-grid">
          <div class="info-card">
            <div class="info-label">Venue Name</div>
            <div class="info-value" style="font-size: 11px; margin-top:2px;">${v.venue}</div>
          </div>
          <div class="info-card">
            <div class="info-label">Capacity</div>
            <div class="info-value">${capacityStr}</div>
          </div>
        </div>
        ${v.notes ? `<div class="notes-box"><b>Notes:</b> ${v.notes}</div>` : ''}
        <a href="${wikiUrl}" target="_blank" rel="noopener noreferrer" class="wiki-btn">View on Wikipedia &rarr;</a>
      `;

      // Highlight active item in sidebar
      document.querySelectorAll('.school-item').forEach(el => el.classList.remove('selected-active'));
      const activeEl = document.getElementById(`school-item-${v.college.replace(/\s+/g, '_')}`);
      if (activeEl) activeEl.classList.add('selected-active');

      const imgUrl = await fetchWikiImage(v.wikiUrl, v.venue);
      const photoBox = document.getElementById('photo-box');
      if (photoBox) {
        if (imgUrl) {
          photoBox.innerHTML = `<img src="${imgUrl}" alt="${v.venue}">`;
        } else {
          photoBox.innerHTML = `<div class="photo-placeholder">No Wikipedia photo available</div>`;
        }
      }
    }

    function renderSidebarTree(groupedData) {
      const container = document.getElementById('sidebar-tree');
      container.innerHTML = '';

      Object.keys(groupedData).sort().forEach(conf => {
        const schools = groupedData[conf].sort((a, b) => a.college.localeCompare(b.college));
        const color = CONFERENCE_COLORS[conf] || "#475569";

        const groupDiv = document.createElement('div');
        groupDiv.className = 'conf-group';

        const summaryDiv = document.createElement('div');
        summaryDiv.className = 'conf-summary';
        
        // Clicking conference swatch/name acts as a global toggle for all schools in that conference
        summaryDiv.innerHTML = `
          <div class="conf-info-left" title="Click to toggle entire conference">
            <span class="conf-swatch" style="background:${color};"></span>
            <span><b>${conf}</b> (${schools.length})</span>
          </div>
          <span class="conf-toggle-arrow">▼ Expand</span>
        `;

        const listDiv = document.createElement('div');
        listDiv.className = 'school-list';
        listDiv.style.display = 'none';

        // Global conference toggle handler
        summaryDiv.querySelector('.conf-info-left').addEventListener('click', () => {
          const checkboxes = listDiv.querySelectorAll('.school-checkbox');
          const allChecked = Array.from(checkboxes).every(cb => cb.checked);
          checkboxes.forEach(cb => cb.checked = !allChecked);
          updateMapFilters();
        });

        // Expand/Collapse arrow handler
        summaryDiv.querySelector('.conf-toggle-arrow').addEventListener('click', (e) => {
          e.stopPropagation();
          const isHidden = listDiv.style.display === 'none';
          listDiv.style.display = isHidden ? 'flex' : 'none';
          e.target.textContent = isHidden ? '▲ Collapse' : '▼ Expand';
        });

        schools.forEach(v => {
          const itemLabel = document.createElement('label');
          itemLabel.className = 'school-item';
          itemLabel.id = `school-item-${v.college.replace(/\s+/g, '_')}`;
          itemLabel.innerHTML = `
            <input type="checkbox" class="school-checkbox" value="${v.college}" checked>
            <span class="school-name">${v.college}</span>
          `;

          itemLabel.querySelector('.school-name').addEventListener('click', (e) => {
            e.preventDefault();
            map.flyTo(v.coords, 15, { duration: 0.8 });
            if (markersMap[v.college]) {
              markersMap[v.college].openPopup();
            }
            showVenueDetails(v);
          });

          itemLabel.querySelector('.school-checkbox').addEventListener('change', updateMapFilters);
          listDiv.appendChild(itemLabel);
        });

        groupDiv.appendChild(summaryDiv);
        groupDiv.appendChild(listDiv);
        container.appendChild(groupDiv);
      });
      updateActiveCount();
    }

    function updateMapFilters() {
      venueLayer.clearLayers();
      markersMap = {};
      let visibleCount = 0;

      document.querySelectorAll('.school-checkbox').forEach(cb => {
        const collegeName = cb.value;
        const v = venues.find(item => item.college === collegeName);
        if (v && cb.checked) {
          visibleCount++;
          const color = CONFERENCE_COLORS[v.conference] || "#475569";
          const marker = L.circleMarker(v.coords, {
            radius: 6.5, fillColor: color, color: "#ffffff", weight: 1.5, opacity: 1, fillOpacity: 0.95
          }).addTo(venueLayer);

          marker.on('click', () => {
            map.flyTo(v.coords, 15, { duration: 0.8 });
            showVenueDetails(v);
          });

          marker.bindTooltip(`<b>${v.college}</b>`, { direction: 'top', className: 'venue-tooltip', offset: [0, -8] });
          markersMap[v.college] = marker;
        }
      });

      document.getElementById('active-count').textContent = `${visibleCount} of ${venues.length} shown`;
      updateBasemapForZoom();
    }

    function updateActiveCount() {
      const checked = document.querySelectorAll('.school-checkbox:checked').length;
      document.getElementById('active-count').textContent = `${checked} of ${venues.length} shown`;
    }

    window.handleGvizResponse = function(response) {
      if (!response || !response.table) return;
      const cols = response.table.cols.map((c, idx) => (c && c.label) ? c.label.trim() : String.fromCharCode(65 + idx));
      const rawRows = response.table.rows.map(r => {
        let rowObj = {};
        if (r && r.c) {
          r.c.forEach((cell, idx) => {
            rowObj[cols[idx] || String.fromCharCode(65 + idx)] = (cell && cell.v !== null) ? cell.v : '';
          });
        }
        return rowObj;
      });

      function getRowVal(row, possibleKeys) {
        for (let key of possibleKeys) {
          for (let rk in row) {
            if (rk.trim().toLowerCase() === key.toLowerCase()) return row[rk];
          }
        }
        return '';
      }

      venues = [];
      const grouped = {};

      rawRows.forEach(row => {
        const conf = String(getRowVal(row, ['FBS Conference', 'Conference']) || '').trim();
        const college = String(getRowVal(row, ['College/University Name', 'College', 'Team Name']) || '').trim();
        const mascot = String(getRowVal(row, ['Mascot']) || '').trim();
        const venueName = String(getRowVal(row, ['Venue Name', 'Venue']) || '').trim();
        const venueCity = String(getRowVal(row, ['Venue City', 'City']) || '').trim();
        const capacity = getRowVal(row, ['Venue Capacity for Football', 'Capacity']);
        const notes = String(getRowVal(row, ['Notes (as needed)', 'Notes']) || '').trim();
        const lat = parseFloat(getRowVal(row, ['Latitude', 'Lat']));
        const lng = parseFloat(getRowVal(row, ['Longitude', 'Lng']));
        const wikiUrl = String(getRowVal(row, ['Venue Wiki', 'Wiki', 'Wikipedia']) || '').trim();

        if (!venueName || isNaN(lat) || isNaN(lng) || !college) return;
        const vObj = { conference: conf, college, mascot, venue: venueName, venueCity, capacity, notes, coords: [lat, lng], wikiUrl };
        venues.push(vObj);

        if (!grouped[conf]) grouped[conf] = [];
        grouped[conf].push(vObj);
      });

      renderSidebarTree(grouped);
      updateMapFilters();
    };

    document.getElementById('btn-all').addEventListener('click', () => {
      document.querySelectorAll('.school-checkbox').forEach(cb => cb.checked = true);
      updateMapFilters();
    });
    document.getElementById('btn-none').addEventListener('click', () => {
      document.querySelectorAll('.school-checkbox').forEach(cb => cb.checked = false);
      updateMapFilters();
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      map.setView([39.8283, -98.5795], 4);
    });

    const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&tqx=responseHandler:handleGvizResponse`;
    const script = document.createElement('script');
    script.src = gvizUrl;
    document.body.appendChild(script);

    map.on('zoomend', updateBasemapForZoom);
  </script>
</body>
</html>
